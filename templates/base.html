{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Voyage AI — Intelligent AI-powered travel planning."
    >

    <title>
        {% block title %}
            Voyage AI
        {% endblock %}
    </title>

    <!-- MAIN CSS -->
    <link
        rel="stylesheet"
        href="{% static 'css/app.css' %}"
    >

</head>

<body>

    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <header class="site-header">

        <nav class="navbar">

            <a
                href="{% url 'home' %}"
                class="brand"
            >
                <span class="brand-icon">✦</span>
                <span>Voyage AI</span>
            </a>


            <div class="nav-links">

                <a href="{% url 'home' %}">
                    Home
                </a>

                <a href="{% url 'planner' %}">
                    AI Planner
                </a>

                <a
                    href="/admin/"
                    class="nav-admin"
                >
                    Admin
                </a>

            </div>

        </nav>

    </header>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="site-footer">

        <div class="footer-inner">

            <div class="footer-brand">
                <span class="brand-icon">✦</span>
                Voyage AI
            </div>

            <p>
                AI Travel Copilot
            </p>

            <span class="footer-copy">
                © 2026 Voyage AI
            </span>

        </div>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        src="{% static 'js/app.js' %}"
    ></script>

</body>

</html>
